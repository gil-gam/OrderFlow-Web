<div class="container mx-auto p-6 bg-slate-900 text-white min-h-screen">
  <h1 class="text-3xl font-bold mb-8">Inventory</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (p of products(); track p.id) {
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
      <div class="flex justify-between items-start mb-4">
        <h3 class="text-lg font-bold">{{ p.name }}</h3>
        <span class="text-xs bg-slate-700 px-2 py-1 rounded">{{ p.categoryName }}</span>
      </div>
      <div class="flex justify-between items-end">
        <div>
          <div class="text-2xl font-bold text-emerald-400">{{ p.unitPrice | currency:'USD' }}</div>
          <div class="text-xs text-slate-500">Stock: {{ p.stockQuantity }} units</div>
        </div>
        <button class="text-blue-400 text-sm">Edit</button>
      </div>
    </div>
    }
  </div>
</div>
