<div class="mx-auto max-w-2xl">
  <of-page-header [title]="isEdit() ? 'Edit Product' : 'New Product'"
                  [subtitle]="isEdit() ? 'Update product details' : 'Create a new product'" />

  @if (error()) {
  <div class="mb-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">
    {{ error() }}
  </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5 rounded-xl border border-slate-800 bg-slate-900 p-6">
    <div>
      <label for="name" class="mb-1.5 block text-sm font-medium text-slate-300">Name</label>
      <input id="name" type="text" formControlName="name"
             class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-blue-500"
             placeholder="Product name" />
      <of-validation-error [control]="form.get('name')" />
    </div>

    <div>
      <label for="description" class="mb-1.5 block text-sm font-medium text-slate-300">Description</label>
      <textarea id="description" formControlName="description" rows="3"
                class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-blue-500"
                placeholder="Product description"></textarea>
      <of-validation-error [control]="form.get('description')" />
    </div>

    <div>
      <label for="categoryId" class="mb-1.5 block text-sm font-medium text-slate-300">Category</label>
      <select id="categoryId" formControlName="categoryId"
              class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 outline-none focus:border-blue-500">
        <option value="" disabled>Select a category</option>
        @for (cat of categories(); track cat.id) {
        <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
      <of-validation-error [control]="form.get('categoryId')" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="unitPrice" class="mb-1.5 block text-sm font-medium text-slate-300">Unit Price</label>
        <input id="unitPrice" type="number" step="0.01" min="0.01" formControlName="unitPrice"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 outline-none focus:border-blue-500" />
        <of-validation-error [control]="form.get('unitPrice')" />
      </div>
      <div>
        <label for="currency" class="mb-1.5 block text-sm font-medium text-slate-300">Currency</label>
        <input id="currency" type="text" maxlength="3" formControlName="currency"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 outline-none focus:border-blue-500"
               placeholder="BRL" />
        <of-validation-error [control]="form.get('currency')" />
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid || submitting()"
            class="flex w-full items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
      {{ submitting() ? 'Saving...' : (isEdit() ? 'Save Changes' : 'Create Product') }}
    </button>
  </form>
</div>
