<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-100">{{ isEdit() ? 'Edit Product' : 'New Product' }}</h1>
  <p class="mt-1 text-sm text-slate-400">
    {{ isEdit() ? 'Update the product details below.' : 'Add a new product to the catalog.' }}
  </p>
</div>

<div class="rounded-xl border border-slate-800 bg-slate-900 shadow-xl shadow-black/40">
  @if (error()) {
  <div class="m-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6" novalidate>
    <fieldset>
      <legend class="px-2 text-sm font-semibold text-slate-300">Product information</legend>

      <p class="mt-4">
        <label for="prod-name" class="mb-1.5 block text-sm font-medium text-slate-300">Name</label>
        <input id="prod-name" formControlName="name" placeholder="Product name"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               [class.border-red-500]="form.get('name')?.invalid && (form.get('name')?.dirty || form.get('name')?.touched)" />
        <of-validation-error [control]="form.get('name')" />
      </p>

      <p>
        <label for="prod-description" class="mb-1.5 block text-sm font-medium text-slate-300">Description</label>
        <textarea id="prod-description" formControlName="description" rows="3" placeholder="Brief description of the product"
                  class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"></textarea>
        <of-validation-error [control]="form.get('description')" />
      </p>

      <p>
        <label for="prod-category" class="mb-1.5 block text-sm font-medium text-slate-300">Category</label>
        <select id="prod-category" formControlName="categoryId"
                class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                [class.border-red-500]="form.get('categoryId')?.invalid && (form.get('categoryId')?.dirty || form.get('categoryId')?.touched)">
          <option value="" disabled>Select category...</option>
          @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
          }
        </select>
        <of-validation-error [control]="form.get('categoryId')" />
      </p>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <p>
          <label for="prod-price" class="mb-1.5 block text-sm font-medium text-slate-300">Unit price (USD)</label>
          <input id="prod-price" type="number" step="0.01" min="0.01" formControlName="price" placeholder="0.00"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                 [class.border-red-500]="form.get('price')?.invalid && (form.get('price')?.dirty || form.get('price')?.touched)" />
          <of-validation-error [control]="form.get('price')" />
        </p>

        <p>
          <label for="prod-stock" class="mb-1.5 block text-sm font-medium text-slate-300">Stock quantity</label>
          <input id="prod-stock" type="number" min="0" formControlName="stockQuantity" placeholder="0"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                 [class.border-red-500]="form.get('stockQuantity')?.invalid && (form.get('stockQuantity')?.dirty || form.get('stockQuantity')?.touched)" />
          <of-validation-error [control]="form.get('stockQuantity')" />
        </p>
      </div>

      <p class="flex items-center justify-between border-t border-slate-800 pt-5">
        <a routerLink="/products" class="text-sm font-medium text-slate-400 hover:text-slate-200">&larr; Back to products</a>
        <button type="submit" [disabled]="form.invalid || submitting()"
                class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
          @if (submitting()) { {{ isEdit() ? 'Saving...' : 'Creating...' }} }
          @else { {{ isEdit() ? 'Save Changes' : 'Create Product' }} }
        </button>
      </p>
    </fieldset>
  </form>
</div>
