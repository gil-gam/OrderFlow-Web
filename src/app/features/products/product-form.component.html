<div class="max-w-2xl mx-auto p-8 bg-slate-900 text-white rounded-2xl border border-slate-800 mt-10">
  <h1 class="text-3xl font-bold mb-6 text-blue-400">
    {{ isEdit() ? 'Update Product' : 'New Product' }}
  </h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="space-y-2">
      <label class="block text-sm font-bold text-slate-300">Product Name</label>
      <input type="text" formControlName="name" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3">
    </div>

    <div class="grid grid-cols-2 gap-6">
      <div class="space-y-2">
        <label class="block text-sm font-bold text-slate-300">Price (USD)</label>
        <input type="number" formControlName="price" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3">
      </div>
      <div class="space-y-2">
        <label class="block text-sm font-bold text-slate-300">Stock Quantity</label>
        <input type="number" formControlName="stockQuantity" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3">
      </div>
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-bold text-slate-300">Category</label>
      <select formControlName="categoryId" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3">
        <option [value]="null">Select Category</option>
        @for (cat of categories(); track cat.id) {
        <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="flex gap-4 pt-4">
      <button type="submit" [disabled]="form.invalid || submitting()" class="flex-1 bg-blue-600 py-3 rounded-lg font-bold">
        {{ submitting() ? 'Saving...' : 'Save Product' }}
      </button>
      <button type="button" routerLink="/products" class="px-6 py-3 bg-slate-700 rounded-lg font-bold">Cancel</button>
    </div>
  </form>
</div>
