<div class="container mx-auto p-6 bg-slate-900 text-white min-h-screen">
  <h1 class="text-3xl font-bold mb-8">Dashboard</h1>

  <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
    <div class="p-6 border-b border-slate-700">
      <h2 class="text-xl font-bold">Recent Orders</h2>
    </div>

    <table class="w-full text-left">
      <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase">
        <tr>
          <th class="p-4">Customer</th>
          <th class="p-4">Date</th>
          <th class="p-4">Amount</th>
          <th class="p-4">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-700">
        @for (order of recentOrders(); track order.id) {
        <tr class="hover:bg-slate-700/30 transition-colors">
          <td class="p-4 font-medium">{{ order.customerName }}</td>
          <td class="p-4 text-slate-400 text-sm">{{ order.orderDate | date:'mediumDate' }}</td>
          <td class="p-4 font-bold text-emerald-400">{{ order.totalAmount | currency:'USD' }}</td>
          <td class="p-4">
            <span [class]="statusBadge(order.status)" class="px-2 py-1 rounded text-xs font-bold">
              {{ order.status }}
            </span>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
