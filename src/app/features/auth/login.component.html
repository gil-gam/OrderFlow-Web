<div class="rounded-xl border border-slate-800 bg-slate-900 shadow-xl shadow-black/40">
  @if (error()) {
  <div class="m-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">
    {{ error() }}
  </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6" autocomplete="off" novalidate>
    <fieldset>
      <legend class="px-2 text-sm font-semibold text-slate-300">Sign in</legend>

      <p class="mt-4">
        <label for="login-email" class="mb-1.5 block text-sm font-medium text-slate-300">Email</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="username"
               placeholder="you@example.com"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               [class.border-red-500]="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)" />
        <of-validation-error [control]="form.get('email')" />
      </p>

      <p>
        <label for="login-password" class="mb-1.5 block text-sm font-medium text-slate-300">Password</label>
        <input id="login-password" type="password" formControlName="password" autocomplete="current-password"
               placeholder="Enter your password"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               [class.border-red-500]="form.get('password')?.invalid && (form.get('password')?.dirty || form.get('password')?.touched)" />
        <of-validation-error [control]="form.get('password')" />
      </p>

      <p>
        <label class="flex items-center gap-2 text-sm text-slate-400">
          <input type="checkbox" formControlName="remember" value="yes"
                 class="h-4 w-4 rounded border-slate-700 bg-slate-950 accent-blue-500" />
          Remember me
        </label>
      </p>

      <button type="submit" [disabled]="form.invalid || submitting()"
              class="mt-2 flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
        @if (submitting()) {
        <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
        Signing in...
        } @else {
        Log in
        }
      </button>
    </fieldset>
  </form>

  <p class="border-t border-slate-800 p-4 text-center text-sm text-slate-400">
    Don't have an account?
    <a routerLink="/auth/register" class="font-medium text-blue-400 hover:text-blue-300">Register</a>
  </p>
</div>
