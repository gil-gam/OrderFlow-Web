<div class="rounded-xl border border-slate-800 bg-slate-900 shadow-xl shadow-black/40">
  @if (error()) {
  <div class="m-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">
    {{ error() }}
  </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6" autocomplete="off" novalidate>
    <fieldset>
      <legend class="px-2 text-sm font-semibold text-slate-300">Create an account</legend>

      <p class="mt-4">
        <label for="reg-name" class="mb-1.5 block text-sm font-medium text-slate-300">Full name</label>
        <input id="reg-name" type="text" formControlName="name" autocomplete="name" placeholder="John Doe"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               [class.border-red-500]="form.get('name')?.invalid && (form.get('name')?.dirty || form.get('name')?.touched)" />
        <of-validation-error [control]="form.get('name')" />
      </p>

      <p>
        <label for="reg-email" class="mb-1.5 block text-sm font-medium text-slate-300">Email</label>
        <input id="reg-email" type="email" formControlName="email" autocomplete="username" placeholder="you@example.com"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               [class.border-red-500]="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)" />
        <of-validation-error [control]="form.get('email')" />
      </p>

      <p>
        <label for="reg-password" class="mb-1.5 block text-sm font-medium text-slate-300">Password</label>
        <input id="reg-password" type="password" formControlName="password" autocomplete="new-password" minlength="6"
               placeholder="Minimum 6 characters"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               [class.border-red-500]="form.get('password')?.invalid && (form.get('password')?.dirty || form.get('password')?.touched)" />
        <of-validation-error [control]="form.get('password')" />
      </p>

      <p>
        <label for="reg-confirm" class="mb-1.5 block text-sm font-medium text-slate-300">Confirm password</label>
        <input id="reg-confirm" type="password" formControlName="confirmPassword" autocomplete="new-password"
               placeholder="Repeat your password"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               [class.border-red-500]="form.get('confirmPassword')?.invalid && (form.get('confirmPassword')?.dirty || form.get('confirmPassword')?.touched)" />
        <of-validation-error [control]="form.get('confirmPassword')" />
      </p>

      <button type="submit" [disabled]="form.invalid || submitting()"
              class="mt-2 flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
        @if (submitting()) {
        <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
        Creating account...
        } @else {
        Register
        }
      </button>
    </fieldset>
  </form>

  <p class="border-t border-slate-800 p-4 text-center text-sm text-slate-400">
    Already have an account?
    <a routerLink="/auth/login" class="font-medium text-blue-400 hover:text-blue-300">Sign in</a>
  </p>
</div>
