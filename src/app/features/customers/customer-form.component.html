<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-100">{{ isEdit() ? 'Edit Customer' : 'New Customer' }}</h1>
  <p class="mt-1 text-sm text-slate-400">
    {{ isEdit() ? 'Update customer information.' : 'Add a new customer to the system.' }}
  </p>
</div>

<div class="rounded-xl border border-slate-800 bg-slate-900 p-6">
  @if (error()) {
  <div class="mb-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-300">Full Name</label>
        <input formControlName="name"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               placeholder="John Doe" />
        <of-validation-error [control]="form.get('name')" />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-300">Email</label>
        <input type="email" formControlName="email"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               placeholder="john@example.com" />
        <of-validation-error [control]="form.get('email')" />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-300">Phone</label>
        <input formControlName="phone"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
               placeholder="+1 (555) 123-4567" />
        <of-validation-error [control]="form.get('phone')" />
      </div>
    </div>

    <fieldset class="rounded-lg border border-slate-800 p-4">
      <legend class="px-2 text-sm font-medium text-slate-300">Address</legend>
      <div class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-sm text-slate-400">Street</label>
          <input formControlName="street"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                 placeholder="123 Main St" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm text-slate-400">City</label>
          <input formControlName="city"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                 placeholder="New York" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm text-slate-400">State</label>
          <input formControlName="state"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                 placeholder="NY" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm text-slate-400">Zip Code</label>
          <input formControlName="zipCode"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                 placeholder="10001" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm text-slate-400">Country</label>
          <input formControlName="country"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                 placeholder="United States" />
        </div>
      </div>
    </fieldset>

    <div class="flex items-center justify-between border-t border-slate-800 pt-5">
      <a routerLink="/customers" class="text-sm font-medium text-slate-400 hover:text-slate-200">&larr; Back</a>
      <button type="submit" [disabled]="form.invalid || submitting()"
              class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
        @if (submitting()) { {{ isEdit() ? 'Saving...' : 'Creating...' }} }
        @else { {{ isEdit() ? 'Save Changes' : 'Create Customer' }} }
      </button>
    </div>
  </form>
</div>
