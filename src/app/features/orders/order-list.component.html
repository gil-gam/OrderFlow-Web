<div class="container mx-auto p-6 bg-slate-900 text-white min-h-screen">
  <h1 class="text-3xl font-bold mb-8">Orders List</h1>

  <div class="overflow-x-auto rounded-lg border border-slate-700">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-800 text-slate-300">
        <tr>
          <th class="p-4">Order ID</th>
          <th class="p-4">Date</th>
          <th class="p-4">Items</th>
          <th class="p-4">Total</th>
          <th class="p-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-700">
        @for (order of orders(); track order.id) {
        <tr class="hover:bg-slate-800/50 transition-colors">
          <td class="p-4 font-mono text-sm text-blue-400">#{{ order.id.substring(0,8) }}</td>
          <td class="p-4 text-slate-400">{{ order.orderDate | date:'short' }}</td>
          <td class="p-4">{{ (order.items?.length ?? order.itemCount) }} items</td>
          <td class="p-4 font-bold text-emerald-400">{{ order.totalAmount | currency:'USD' }}</td>
          <td class="p-4 text-right">
            <button class="text-blue-400 hover:underline">Details</button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
