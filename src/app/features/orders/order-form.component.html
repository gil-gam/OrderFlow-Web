<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-100">New Order</h1>
  <p class="mt-1 text-sm text-slate-400">Create a new order for a customer.</p>
</div>

@if (loading()) {
<of-loading-state message="Loading customers and products..." />
} @else {
<div class="rounded-xl border border-slate-800 bg-slate-900 shadow-xl shadow-black/40">
  @if (error()) {
  <div class="m-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6" novalidate>
    <fieldset>
      <legend class="px-2 text-sm font-semibold text-slate-300">Order details</legend>

      <p class="mt-4">
        <label for="order-customer" class="mb-1.5 block text-sm font-medium text-slate-300">Customer</label>
        <select id="order-customer" formControlName="customerId"
                class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30">
          <option [ngValue]="null" disabled>Choose a customer...</option>
          @for (c of customers(); track c.id) {
          <option [value]="c.id">{{ c.name }} ({{ c.email }})</option>
          }
        </select>
        <of-validation-error [control]="form.get('customerId')" />
      </p>

      <fieldset class="mt-4 rounded-lg border border-slate-700 p-4">
        <legend class="flex items-center gap-2 px-2 text-sm font-medium text-slate-300">
          Order items
          <button type="button" (click)="addItem()"
                  class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:bg-slate-700">
            + Add item
          </button>
        </legend>

        <div formArrayName="items" class="mt-3 space-y-3">
          @for (item of items.controls; track $index) {
          <div [formGroupName]="$index" class="flex items-start gap-3 rounded-lg border border-slate-800 bg-slate-950 p-3">
            <div class="flex-1">
              <select formControlName="productId"
                      class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none transition focus:border-blue-500">
                <option [ngValue]="null" disabled>Select product...</option>
                @for (p of products(); track p.id) {
                <option [value]="p.id">{{ p.name }} — {{ p.unitPrice | currency: (p.currency || 'USD') }}</option>
                }
              </select>
            </div>
            <div class="w-24">
              <input type="number" formControlName="quantity" min="1" placeholder="Qty"
                     class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-center text-sm text-slate-100 outline-none transition focus:border-blue-500" />
            </div>
            <button type="button" (click)="removeItem($index)"
                    class="mt-0.5 flex h-9 w-9 items-center justify-center rounded-lg border border-slate-700 bg-red-500/10 text-sm text-red-400 transition hover:bg-red-500/20">
              ✕
            </button>
          </div>
          }
        </div>

        @if (items.length === 0) {
        <p class="mt-3 text-sm italic text-slate-500">No items added yet. Click "+ Add item" above.</p>
        }
      </fieldset>

      <p class="flex items-center justify-between border-t border-slate-800 pt-5">
        <a routerLink="/orders" class="text-sm font-medium text-slate-400 hover:text-slate-200">&larr; Back to orders</a>
        <button type="submit" [disabled]="form.invalid || submitting()"
                class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
          @if (submitting()) {
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
          </svg>
          Creating...
          } @else {
          Create Order
          }
        </button>
      </p>
    </fieldset>
  </form>
</div>
}
