<div class="container mx-auto p-6 bg-slate-900 text-white min-h-screen">
  <h1 class="text-3xl font-bold mb-8">Create New Order</h1>

  @if (loading()) {
  <div class="flex justify-center p-12">
    <span class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></span>
  </div>
  } @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-8">
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <label class="block text-lg font-bold mb-4">Customer Selection</label>
      <select formControlName="customerId" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 outline-none">
        <option [value]="null">Choose a customer...</option>
        @for (c of customers(); track c.id) {
        <option [value]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <div class="flex justify-between items-center mb-6">
        <label class="text-lg font-bold">Order Items</label>
        <button type="button" (click)="addItem()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">+ Add Item</button>
      </div>

      <div formArrayName="items" class="space-y-4">
        @for (item of items.controls; track $index) {
        <div [formGroupName]="$index" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end bg-slate-900/50 p-4 rounded-lg">
          <div class="md:col-span-7">
            <label class="block text-xs text-slate-400 mb-1">Product</label>
            <select formControlName="productId" class="w-full bg-slate-800 border border-slate-700 rounded p-2">
              <option [value]="null">Select Product</option>
              @for (p of products(); track p.id) {
              <option [value]="p.id">{{ p.name }} ({{ p.unitPrice | currency:'USD' }})</option>
              }
            </select>
          </div>
          <div class="md:col-span-3">
            <label class="block text-xs text-slate-400 mb-1">Quantity</label>
            <input type="number" formControlName="quantity" class="w-full bg-slate-800 border border-slate-700 rounded p-2">
          </div>
          <div class="md:col-span-2">
            <button type="button" (click)="removeItem($index)" class="w-full bg-red-900/50 text-red-200 py-2 rounded">Remove</button>
          </div>
        </div>
        }
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid || submitting()" class="w-full bg-emerald-600 py-4 rounded-lg font-bold text-lg">
      {{ submitting() ? 'Processing...' : 'Place Order' }}
    </button>
  </form>
  }
</div>
