<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-100">New Order</h1>
  <p class="mt-1 text-sm text-slate-400">Create a new order for a customer.</p>
</div>

@if (loading()) {
<of-loading-state message="Loading customers and products..." />
} @else {
<div class="rounded-xl border border-slate-800 bg-slate-900 p-6">
  @if (error()) {
  <div class="mb-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label for="customer" class="mb-1.5 block text-sm font-medium text-slate-300">Customer</label>
      <select formControlName="productId" class="...">
        <option value="" disabled>Select a product</option>
        @for (p of products(); track p.id) {
        <option [value]="p.id">{{ p.name }} — {{ p.unitPrice | currency: p.currency }}</option>
        }
      </select>
      <of-validation-error [control]="form.get('customerId')" />
    </div>

    <div>
      <div class="mb-3 flex items-center justify-between">
        <label class="text-sm font-medium text-slate-300">Items</label>
        <button type="button" (click)="addItem()"
                class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:bg-slate-700">
          + Add item
        </button>
      </div>

      <div formArrayName="items" class="space-y-3">
        @for (item of items.controls; track item; let i = $index) {
        <div [formGroupName]="i" class="flex items-start gap-3 rounded-lg border border-slate-800 bg-slate-950 p-3">
          <div class="flex-1">
            <select formControlName="productId"
                    class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none transition focus:border-blue-500">
              <option value="">Select product...</option>
              @for (p of products(); track p.id) {
              <option [value]="p.id">{{ p.name }} — {{ p.price | currency:'USD' }}</option>
              }
            </select>
          </div>
          <div class="w-24">
            <input type="number" formControlName="quantity" min="1"
                   class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-center text-sm text-slate-100 outline-none transition focus:border-blue-500"
                   placeholder="Qty" />
          </div>
          <button type="button" (click)="removeItem(i)"
                  class="mt-0.5 flex h-9 w-9 items-center justify-center rounded-lg border border-slate-700 bg-red-500/10 text-sm text-red-400 transition hover:bg-red-500/20">
            ✕
          </button>
        </div>
        }
      </div>
    </div>

    <div class="flex items-center justify-between border-t border-slate-800 pt-5">
      <a routerLink="/orders" class="text-sm font-medium text-slate-400 hover:text-slate-200">&larr; Back</a>
      <button type="submit" [disabled]="form.invalid || submitting()"
              class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
        @if (submitting()) { Creating... } @else { Create Order }
      </button>
    </div>
  </form>
</div>
}
